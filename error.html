<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="요청하신 페이지를 찾을 수 없습니다. / The page you requested could not be found." />
    <meta name="theme-color" content="#0a0a0b" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <link rel="stylesheet" href="/src/index.css" />
    <title>페이지를 찾을 수 없습니다 · SubCharacters</title>
    <script>
      // 첫 페인트 전에 테마를 적용해 깜빡임 방지 (기본값: 다크)
      try {
        if (localStorage.getItem('theme') !== 'light') document.documentElement.classList.add('dark');
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    </script>
  </head>
  <body>
    <main class="relative flex min-h-screen flex-col items-center justify-center overflow-hidden px-5 text-center">
      <!-- 홈과 같은 그리드 + 글로우 배경 -->
      <div
        aria-hidden="true"
        class="pointer-events-none absolute inset-0 [background-image:linear-gradient(to_right,rgb(113_113_122/0.12)_1px,transparent_1px),linear-gradient(to_bottom,rgb(113_113_122/0.12)_1px,transparent_1px)] [background-size:48px_48px] [mask-image:radial-gradient(ellipse_at_center,black_20%,transparent_70%)]"
      ></div>
      <div
        aria-hidden="true"
        class="pointer-events-none absolute left-1/2 top-1/3 h-72 w-[36rem] -translate-x-1/2 rounded-full bg-lime-400/20 blur-3xl dark:bg-lime-400/10"
      ></div>

      <div class="relative">
        <p class="font-mono text-xs uppercase tracking-widest text-lime-600 dark:text-accent">Error</p>
        <h1 class="mt-4 text-5xl font-bold tracking-tight [word-break:keep-all] sm:text-7xl">페이지를 찾을 수 없습니다</h1>
        <p class="mt-4 text-lg text-zinc-500 dark:text-zinc-500">The page you requested could not be found.</p>
        <p class="mx-auto mt-6 max-w-md leading-relaxed text-zinc-600 [word-break:keep-all] dark:text-zinc-400">
          주소가 바뀌었거나 삭제된 페이지일 수 있습니다. 주소를 다시 확인해 주세요.
        </p>
        <div class="mt-10 flex flex-wrap justify-center gap-3">
          <a
            href="/"
            class="group inline-flex items-center gap-2 rounded-full bg-zinc-900 px-5 py-2.5 text-sm font-medium text-white transition hover:bg-zinc-700 dark:bg-white dark:text-zinc-900 dark:hover:bg-zinc-200"
          >
            홈으로
            <span class="transition group-hover:translate-x-0.5">→</span>
          </a>
        </div>
      </div>

      <footer class="absolute bottom-0 w-full py-8 text-sm text-zinc-500">
        <p>© 2026 SubCharacters</p>
      </footer>
    </main>
  </body>
</html>
